# Lariska 鼠标 —— ESB split peripheral 版本
#
# 相对上游原版的改动（**鼠标自己的按键定义完全保持原样**）：
#   1. 关掉 BLE，改用 ESB 把按键/指针事件发给 dongle 接收器；
#   2. 5 个按键仍然是原来的 gpio-direct kscan（key position 0~4），
#      由 dongle 的 corne keymap 来"翻译"成 LCLK/RCLK/MCLK/MB4/MB5；
#   3. 原来 kscan 的 wakeup-source 与睡眠策略先关掉，等整条链路验证通过再开。

CONFIG_ZMK_USB=y
# BLE 全关：ESB 模块目前不能与 BLE 同时编译
CONFIG_ZMK_BLE=n
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y   # BLE 控制器选项，ESB 用下面的 ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8
# CONFIG_BT_MAX_CONN=3
# CONFIG_BT_MAX_PAIRED=1

# --- 通信链路：ESB split peripheral ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

# 本机在 ESB 网络里的编号：左手=1、右手=2、鼠标=3
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=3

# ESB 参数：必须与 dongle 的 corne_esb_dongle.conf 完全一致
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=250
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=2
CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=y
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_MIN=5
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_STEP=18
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_COUNT=4
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_EVT_RETRY=6
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=16
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30

CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
CONFIG_LOG_BUFFER_SIZE=10240

CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y

CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_PAW3395=y
# CONFIG_REPORT_CPI=y
# CONFIG_PAW3395_SWAP_XY=y // <-- deprecated, use swap-xy; instead
# CONFIG_PAW3395_INVERT_X=y // <-- deprecated, use swap-xy; instead
# CONFIG_PAW3395_INVERT_Y=y // <-- deprecated, use swap-xy; instead
CONFIG_PAW3395_REPORT_INTERVAL_MIN=1
# CONFIG_PAW3395_LOG_LEVEL_DBG=y
# CONFIG_PAW3395_INIT_POWER_UP_EXTRA_DELAY_MS=3000

# 5 个鼠标按键依旧走原来的 gpio-direct kscan（key position 0~4），
# 不需要额外配置；它们的含义由 dongle 的 corne keymap 前 5 个位置决定。

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


CONFIG_VFX_RGBLED_INDICATOR=y
CONFIG_VFX_LDO_PIN=y
CONFIG_VFX_CHRG_PIN=y

# --- ESB 是高频消息，栈和队列要比默认值大 ---
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=512
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=10
CONFIG_USB_WORKQUEUE_STACK_SIZE=4096
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y

# --- 调试 ---
# CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
